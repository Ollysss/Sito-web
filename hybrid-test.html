<!DOCTYPE html>
<html>
<head>
  <title>Hybrid Test</title>
  <style>
    body { font-family: system-ui; background: #0b1326; color: #dae2fd; padding: 40px; }
    .test { margin: 20px 0; padding: 15px; background: #222; border-radius: 8px; }
    .success { border-left: 4px solid #4CAF50; }
    .error { border-left: 4px solid #f44336; }
  </style>
</head>
<body>
  <h1>🧪 Hybrid Architecture Test</h1>
  
  <div class="test" id="test-render">
    <h3>Testing Render API...</h3>
    <p id="render-result">Loading...</p>
  </div>

  <script>
    // Test 1: Fetch from Render
    fetch('https://sito-web-backend.onrender.com/api/projects')
      .then(r => r.json())
      .then(data => {
        const projects = data.projects.map(p => p.title).join(', ');
        document.getElementById('render-result').innerHTML = 
          '<strong style="color: #4CAF50">✅ SUCCESS:</strong> ' + projects;
        document.getElementById('test-render').classList.add('success');
      })
      .catch(err => {
        document.getElementById('render-result').innerHTML = 
          '<strong style="color: #f44336">❌ ERROR:</strong> ' + err.message;
        document.getElementById('test-render').classList.add('error');
      });
  </script>
</body>
</html>
